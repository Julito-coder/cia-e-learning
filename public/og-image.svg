<?xml version="1.0" encoding="UTF-8"?>
<!-- Placeholder OG image — to be replaced with final Figma export in Sprint 3/5. 1200x630, CIA blue + gold. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="CIA E-Learning — Apprendre le français, version Côte d'Azur">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0A3D62"/>
      <stop offset="60%"  stop-color="#0D4574"/>
      <stop offset="100%" stop-color="#093451"/>
    </linearGradient>
    <radialGradient id="halo" cx="78%" cy="50%" r="40%">
      <stop offset="0%"   stop-color="#E6C76B" stop-opacity="0.55"/>
      <stop offset="60%"  stop-color="#CCAE62" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#CCAE62" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="flame" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%"   stop-color="#FFE082"/>
      <stop offset="55%"  stop-color="#FFB347"/>
      <stop offset="100%" stop-color="#E0843C"/>
    </linearGradient>
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E6C76B"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#halo)"/>

  <!-- Spark mascot silhouette, right side -->
  <g transform="translate(920, 230)">
    <ellipse cx="80" cy="200" rx="120" ry="40" fill="#1E90FF" opacity="0.25"/>
    <path d="M80 -30 C 120 30, 160 80, 160 160 C 160 230, 130 280, 80 280 C 30 280, 0 230, 0 160 C 0 80, 40 30, 80 -30 Z" fill="url(#flame)"/>
    <ellipse cx="80" cy="190" rx="48" ry="60" fill="#FFFFFF" opacity="0.92"/>
    <circle cx="65" cy="180" r="5" fill="#093451"/>
    <circle cx="95" cy="180" r="5" fill="#093451"/>
    <path d="M65 210 Q80 220 95 210" stroke="#093451" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Wordmark -->
  <g font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800">
    <text x="80" y="280" font-size="160" fill="#FFFFFF" letter-spacing="-2">CIA</text>
    <text x="80" y="360" font-size="60" fill="url(#text-gradient)" letter-spacing="2">E-LEARNING</text>
    <text x="80" y="450" font-size="32" font-weight="500" fill="#FFFFFF" opacity="0.85">Apprendre le français, version Côte d'Azur</text>
  </g>

  <!-- Tagline footer -->
  <g font-family="'Inter', system-ui, sans-serif" font-size="22" fill="#FFFFFF" opacity="0.55" font-weight="500">
    <text x="80" y="560">Centre International d'Antibes · Depuis 1985</text>
  </g>

  <!-- Decorative gold strip -->
  <rect x="0" y="615" width="1200" height="15" fill="#CCAE62"/>
</svg>
